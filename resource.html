<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resources | Shailesh Rathod</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0a0f; --bg-alpha90: rgba(10,10,15,0.9); --text: #e0e0e0; --text-muted: #a0a0b0; --text-dim: #8888a0;
      --card-bg: rgba(255,255,255,0.03); --card-border: rgba(255,255,255,0.06); --card-hover-bg: rgba(255,255,255,0.06);
      --card-hover-border: rgba(108,92,231,0.3); --footer-color: #555;
      --grad-bg1: rgba(76,0,255,0.08); --grad-bg2: rgba(0,200,255,0.06); --grad-bg3: rgba(255,0,128,0.05);
      --search-border: rgba(255,255,255,0.1); --search-bg: rgba(255,255,255,0.04); --search-icon: #555;
    }
    [data-theme="light"] {
      --bg: #f5f7fa; --bg-alpha90: rgba(245,247,250,0.95); --text: #1a1a2e; --text-muted: #555570; --text-dim: #666680;
      --card-bg: rgba(0,0,0,0.03); --card-border: rgba(0,0,0,0.08); --card-hover-bg: rgba(0,0,0,0.05);
      --card-hover-border: rgba(108,92,231,0.4); --footer-color: #999;
      --grad-bg1: rgba(76,0,255,0.04); --grad-bg2: rgba(0,200,255,0.03); --grad-bg3: rgba(255,0,128,0.03);
      --search-border: rgba(0,0,0,0.12); --search-bg: rgba(0,0,0,0.04); --search-icon: #999;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      overflow-x: hidden;
      transition: background 0.4s ease, color 0.4s ease;
    }
    a { text-decoration: none; color: inherit; }

    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background:
        radial-gradient(ellipse at 20% 50%, var(--grad-bg1) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 20%, var(--grad-bg2) 0%, transparent 50%),
        radial-gradient(ellipse at 60% 80%, var(--grad-bg3) 0%, transparent 50%);
      z-index: -1;
      pointer-events: none;
    }

    .theme-toggle {
      width: 42px; height: 42px; border-radius: 50%;
      border: 1px solid var(--card-border); background: var(--card-bg);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem; transition: all 0.3s ease;
    }
    .theme-toggle:hover { border-color: var(--card-hover-border); transform: rotate(30deg); }

    /* ── Navbar ──────────────────────────────── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 3rem;
      background: var(--bg-alpha90);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--card-border);
    }
    .nav-logo {
      font-size: 1.5rem;
      font-weight: 800;
      background: linear-gradient(135deg, #6c5ce7, #00cec9, #fd79a8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .nav-back {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--text-muted);
      font-weight: 500;
      font-size: 0.95rem;
      transition: color 0.3s;
    }
    .nav-back:hover { color: var(--text); }
    .nav-back svg { width: 18px; height: 18px; fill: currentColor; }

    /* ── Page Header ─────────────────────────── */
    .page-header {
      padding: 7rem 3rem 3rem;
      max-width: 1100px;
      margin: 0 auto;
      text-align: center;
    }
    .page-header h1 {
      font-size: 2.8rem;
      font-weight: 900;
    }
    .page-header h1 span {
      background: linear-gradient(135deg, #6c5ce7, #00cec9);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .page-header p {
      color: var(--text-dim);
      font-size: 1.1rem;
      margin-top: 0.5rem;
    }
    .page-header .stats {
      display: flex;
      justify-content: center;
      gap: 2rem;
      margin-top: 1.5rem;
    }
    .page-header .stat {
      text-align: center;
    }
    .page-header .stat-number {
      font-size: 1.8rem;
      font-weight: 800;
      background: linear-gradient(135deg, #6c5ce7, #00cec9);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .page-header .stat-label {
      font-size: 0.8rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* ── Search ───────────────────────────────── */
    .search-bar {
      max-width: 500px;
      margin: 2rem auto 0;
      position: relative;
    }
    .search-bar input {
      width: 100%;
      padding: 0.85rem 1.2rem 0.85rem 3rem;
      border-radius: 50px;
      border: 1px solid var(--search-border);
      background: var(--search-bg);
      color: var(--text);
      font-size: 0.95rem;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: border-color 0.3s;
    }
    .search-bar input::placeholder { color: var(--search-icon); }
    .search-bar input:focus { border-color: rgba(108, 92, 231, 0.5); }
    .search-bar svg {
      position: absolute;
      left: 1.1rem;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      fill: var(--search-icon);
    }

    /* ── Content ──────────────────────────────── */
    .content {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2rem 3rem 4rem;
    }

    .topic-section {
      margin-bottom: 2.5rem;
      animation: fadeUp 0.5s ease forwards;
      opacity: 0;
    }
    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
      from { opacity: 0; transform: translateY(20px); }
    }

    .topic-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--card-border);
    }
    .topic-icon { font-size: 1.5rem; }
    .topic-name {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--text);
    }
    .topic-count {
      margin-left: auto;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.2rem 0.7rem;
      border-radius: 20px;
      background: rgba(108, 92, 231, 0.15);
      color: #a29bfe;
      border: 1px solid rgba(108, 92, 231, 0.25);
    }

    .links-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 0.8rem;
    }
    .link-card {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 1rem 1.2rem;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      transition: all 0.3s ease;
      cursor: pointer;
    }
    .link-card:hover {
      background: var(--card-hover-bg);
      border-color: var(--card-hover-border);
      transform: translateX(4px);
    }
    .link-card .arrow {
      font-family: 'Fira Code', monospace;
      color: #00cec9;
      font-weight: 700;
      font-size: 0.9rem;
      flex-shrink: 0;
    }
    .link-card .link-title {
      font-size: 0.92rem;
      font-weight: 500;
      color: var(--text-muted);
      flex: 1;
    }
    .link-card:hover .link-title { color: var(--text); }
    .link-card .external {
      flex-shrink: 0;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .link-card:hover .external { opacity: 1; }
    .link-card .external svg { width: 14px; height: 14px; fill: #6c5ce7; }

    /* ── Empty / Loading States ────────────── */
    .loading, .empty-state, .error-state {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--text-dim);
    }
    .loading .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(108, 92, 231, 0.2);
      border-top-color: #6c5ce7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .empty-state { font-size: 1.1rem; }
    .error-state h3 { color: #e74c3c; margin-bottom: 0.5rem; }

    /* ── Footer ───────────────────────────────── */
    footer {
      text-align: center;
      padding: 2rem 3rem;
      border-top: 1px solid var(--card-border);
      color: var(--footer-color);
      font-size: 0.85rem;
    }
    footer span {
      background: linear-gradient(135deg, #6c5ce7, #00cec9);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 600;
    }

    @media (max-width: 768px) {
      nav { padding: 1rem 1.5rem; }
      .page-header { padding: 6rem 1.5rem 2rem; }
      .page-header h1 { font-size: 2rem; }
      .content { padding: 1.5rem; }
      .links-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <nav>
    <a href="index.html" class="nav-logo">&lt;SR /&gt;</a>
    <div style="display:flex;align-items:center;gap:1rem;">
      <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">&#9790;</button>
      <a href="index.html#resources" class="nav-back">
      <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      Back to Portfolio
    </a>
    </div>
  </nav>

  <div class="page-header">
    <h1 id="pageTitle"><span>Loading...</span></h1>
    <p id="pageDesc"></p>
    <div class="stats" id="statsBar"></div>
    <div class="search-bar">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <input type="text" id="searchInput" placeholder="Search topics or links..." oninput="filterContent()" />
    </div>
  </div>

  <div class="content" id="content">
    <div class="loading">
      <div class="spinner"></div>
      <p>Loading resources...</p>
    </div>
  </div>

  <footer>
    <p>Designed & Built by <span>Shailesh Rathod</span></p>
  </footer>

  <script>
    // Theme toggle (shared with index.html via localStorage)
    function toggleTheme() {
      const html = document.documentElement;
      const next = html.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      document.getElementById('themeToggle').textContent = next === 'light' ? '\u2600' : '\u263E';
    }
    (function() {
      const saved = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', saved);
      document.getElementById('themeToggle').textContent = saved === 'light' ? '\u2600' : '\u263E';
    })();

    // Resource metadata
    const RESOURCES = {
      dsa_notes: {
        title: 'DSA Notes',
        icon: '📊',
        desc: 'Data Structures & Algorithms - topics, patterns, and curated problem links.',
        file: 'dsa_notes.json'
      },
      system_design: {
        title: 'System Design',
        icon: '📐',
        desc: 'System design concepts, architecture patterns, and case studies.',
        file: 'system_design.json'
      },
      ai_ml: {
        title: 'AI / ML Resources',
        icon: '🤖',
        desc: 'LLM guides, RAG architecture references, and Agentic AI patterns.',
        file: 'ai_ml.json'
      },
      dev_tools: {
        title: 'Dev Tools & Configs',
        icon: '🔧',
        desc: 'Handy developer tools, IDE configs, and productivity setups.',
        file: 'dev_tools.json'
      }
    };

    let allData = [];

    // Get resource type from URL
    const params = new URLSearchParams(window.location.search);
    const resourceKey = params.get('type') || 'dsa_notes';
    const resource = RESOURCES[resourceKey];

    if (!resource) {
      document.getElementById('pageTitle').innerHTML = '<span>Not Found</span>';
      document.getElementById('content').innerHTML = `
        <div class="error-state">
          <h3>Resource not found</h3>
          <p>The requested resource type does not exist.</p>
          <a href="index.html#resources" style="color:#6c5ce7;">Go back to resources</a>
        </div>`;
    } else {
      document.title = `${resource.title} | Shailesh Rathod`;
      document.getElementById('pageTitle').innerHTML = `${resource.icon} <span>${resource.title}</span>`;
      document.getElementById('pageDesc').textContent = resource.desc;
      loadData(resource.file);
    }

    async function loadData(file) {
      try {
        const res = await fetch(file);
        if (!res.ok) throw new Error('File not found');
        allData = await res.json();
        renderStats();
        renderContent(allData);
      } catch (e) {
        document.getElementById('content').innerHTML = `
          <div class="error-state">
            <h3>Could not load data</h3>
            <p>Make sure <code>${file}</code> exists in the portfolio folder.</p>
          </div>`;
      }
    }

    function renderStats() {
      const totalTopics = allData.length;
      const totalLinks = allData.reduce((sum, t) => sum + t.links.length, 0);
      document.getElementById('statsBar').innerHTML = `
        <div class="stat"><div class="stat-number">${totalTopics}</div><div class="stat-label">Topics</div></div>
        <div class="stat"><div class="stat-number">${totalLinks}</div><div class="stat-label">Resources</div></div>
      `;
    }

    function renderContent(data) {
      const container = document.getElementById('content');
      if (data.length === 0) {
        container.innerHTML = '<div class="empty-state">No matching results found.</div>';
        return;
      }
      container.innerHTML = data.map((topic, i) => `
        <div class="topic-section" style="animation-delay: ${i * 0.1}s">
          <div class="topic-header">
            <span class="topic-icon">${topic.icon || '📌'}</span>
            <span class="topic-name">${topic.topic}</span>
            <span class="topic-count">${topic.links.length} links</span>
          </div>
          <div class="links-grid">
            ${topic.links.map(link => `
              <a href="${link.url}" target="_blank" rel="noopener" class="link-card">
                <span class="arrow">&gt;</span>
                <span class="link-title">${link.title}</span>
                <span class="external"><svg viewBox="0 0 24 24"><path d="M19 19H5V5h7V3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/></svg></span>
              </a>
            `).join('')}
          </div>
        </div>
      `).join('');
    }

    function filterContent() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      if (!query) {
        renderContent(allData);
        return;
      }
      const filtered = allData
        .map(topic => ({
          ...topic,
          links: topic.links.filter(l => l.title.toLowerCase().includes(query))
        }))
        .filter(topic => topic.topic.toLowerCase().includes(query) || topic.links.length > 0);

      // If topic name matches, show all its links
      const result = allData
        .map(topic => {
          if (topic.topic.toLowerCase().includes(query)) return topic;
          const matchedLinks = topic.links.filter(l => l.title.toLowerCase().includes(query));
          if (matchedLinks.length > 0) return { ...topic, links: matchedLinks };
          return null;
        })
        .filter(Boolean);

      renderContent(result);
    }
  </script>

</body>
</html>
